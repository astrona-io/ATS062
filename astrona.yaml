training:
  id: ATS062
  title: 'CAPA: Argo Rollouts'
  description: 'Detailed reading material and reusable YAML knowledge checks for CAPA:
    Argo Rollouts. Each module pairs a layered reader with an ungraded playground and a
    graded lab. Each section closes with a capstone lab and a knowledge check.'
  certification:
    name: Certified Argo Project Associate
    code: CAPA
    provider: CNCF / Linux Foundation
    domain: Argo Rollouts
    weight: 18
    competencies:
    - Understand Argo Rollouts Fundamentals
    - Use Common Progressive Rollout Strategies
    - Describe Analysis Template and AnalysisRun
