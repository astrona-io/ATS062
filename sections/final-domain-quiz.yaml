- id: ats062-final-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: The switch happens only after the new pods are available
  source_readings:
  - sections/section-020/module-01/course-03-scale-down-and-preview-behaviour.md
  prompt: In what order does the controller promote a blue-green revision?
  options:
  - id: a
    text: Scale down the old ReplicaSet first, then switch.
    explanation: Not correct. The switch happens only after the new pods are available.
  - id: b
    text: Scale up, switch the active Service, wait, scale the old ReplicaSet down.
    explanation: Correct. The switch happens only after the new pods are available.
  - id: c
    text: Delete the old ReplicaSet, then scale up.
    explanation: Not correct. The switch happens only after the new pods are available.
  - id: d
    text: Switch the active Service, scale up, scale down.
    explanation: Not correct. The switch happens only after the new pods are available.
  correct_option: b
  explanation: Correct. The switch happens only after the new pods are available.
