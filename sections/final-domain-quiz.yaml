# Final domain knowledge check across all three sections.
schema_version: 1
kind: question_bank
id: ats062-final
course_id: ATS062
exam_code: CAPA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: domain
  id: argo-rollouts
  title: "Argo Rollouts"
questions:
  - id: ats062-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read stableRS and currentPodHash to know the state of a release"
    source_readings:
      - sections/section-010/module-01/course-02-replicasets-hashes-and-revisions.md
    prompt: "A `Rollout` shows `status.currentPodHash` different from `status.stableRS`. What does this mean?"
    options:
      - id: a
        text: "A new revision exists and has not yet been promoted to stable."
        explanation: "Correct. `currentPodHash` is the newest template, `stableRS` is the last fully promoted one."
      - id: b
        text: "The `Rollout` is broken and must be deleted."
        explanation: "The two values differ during every normal release."
      - id: c
        text: "The `Rollout` has no ReplicaSet for the stable revision."
        explanation: "The stable ReplicaSet exists. The hashes are for two different ReplicaSets."
      - id: d
        text: "The Service selector is wrong."
        explanation: "The Service selector is not part of these two status fields."
    correct_option: a
    explanation: "Correct. `currentPodHash` is the newest template, `stableRS` is the last fully promoted one."

  - id: ats062-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe revisionHistoryLimit"
    source_readings:
      - sections/section-010/module-01/course-02-replicasets-hashes-and-revisions.md
    prompt: "A `Rollout` has `revisionHistoryLimit: 3`. What does the controller do with old ReplicaSets?"
    options:
      - id: a
        text: "It deletes all old ReplicaSets after each release."
        explanation: "The old ReplicaSets are kept, up to the limit."
      - id: b
        text: "It keeps up to 3 old scaled-down ReplicaSets and deletes the oldest beyond that."
        explanation: "Correct. They stay at 0 replicas so that an undo is possible, and the oldest are removed beyond the limit."
      - id: c
        text: "It keeps 3 pods of the old revision running."
        explanation: "Old ReplicaSets are scaled to 0 and run no pods."
      - id: d
        text: "It limits the number of canary steps to 3."
        explanation: "The steps are set in the strategy, not by this field."
    correct_option: b
    explanation: "Correct. They stay at 0 replicas so that an undo is possible, and the oldest are removed beyond the limit."

  - id: ats062-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the phase of a Rollout"
    source_readings:
      - sections/section-010/module-02/course-01-reading-status-and-controlling-a-release.md
    prompt: "A `Rollout` stopped at a `pause: {}` step. Which phase does `status.phase` show?"
    options:
      - id: a
        text: "`Healthy`"
        explanation: "The release is not complete, so the phase is not `Healthy`."
      - id: b
        text: "`Degraded`"
        explanation: "`Degraded` means the release failed or timed out."
      - id: c
        text: "`Paused`"
        explanation: "Correct. The controller reports `Paused` while a pause condition exists."
      - id: d
        text: "`Pending`"
        explanation: "`Pending` is not a Rollout phase."
    correct_option: c
    explanation: "Correct. The controller reports `Paused` while a pause condition exists."

  - id: ats062-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use workloadRef to migrate a Deployment"
    source_readings:
      - sections/section-010/module-02/course-02-migrating-a-deployment-and-routing-traffic.md
    prompt: "You want to adopt a running Deployment into Argo Rollouts without copying its pod template into a new object. Which field do you use?"
    options:
      - id: a
        text: "`spec.workloadRef` in the `Rollout`, with `scaleDown` set to say what happens to the Deployment."
        explanation: "Correct. The `Rollout` reads the pod template from the referenced Deployment, and `scaleDown` controls the Deployment replicas."
      - id: b
        text: "`spec.template.spec.deploymentName`"
        explanation: "This field does not exist."
      - id: c
        text: "`metadata.ownerReferences` pointing at the Deployment, set by hand."
        explanation: "Owner references do not make the controller read the template."
      - id: d
        text: "`strategy.canary.baseDeployment`"
        explanation: "This field does not exist."
    correct_option: a
    explanation: "Correct. The `Rollout` reads the pod template from the referenced Deployment, and `scaleDown` controls the Deployment replicas."

  - id: ats062-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place analysis in a blue-green release"
    source_readings:
      - sections/section-020/module-01/course-02-promotion-analysis-hooks-and-rollback.md
    prompt: "You want a smoke test on the new pods before any user is switched. Which field do you use?"
    options:
      - id: a
        text: "`postPromotionAnalysis`"
        explanation: "This runs after the switch."
      - id: b
        text: "`strategy.canary.analysis`"
        explanation: "This belongs to the canary strategy."
      - id: c
        text: "`prePromotionAnalysis`"
        explanation: "Correct. The controller waits for a `Successful` run before it promotes."
      - id: d
        text: "`previewReplicaCount`"
        explanation: "This sets the number of preview pods and runs no analysis."
    correct_option: c
    explanation: "Correct. The controller waits for a `Successful` run before it promotes."

  - id: ats062-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict replica counts of a canary without a router"
    source_readings:
      - sections/section-020/module-02/course-01-steps-weights-and-replica-counts.md
    prompt: "A canary `Rollout` has 4 replicas and no traffic router. A step sets `setWeight: 25`. How many pods does the canary ReplicaSet have?"
    options:
      - id: a
        text: "0"
        explanation: "At least one pod must run for any weight above 0."
      - id: b
        text: "1"
        explanation: "Correct. The weight is a ratio of the replicas, rounded up, so 25 percent of 4 is 1."
      - id: c
        text: "2"
        explanation: "2 pods would be 50 percent."
      - id: d
        text: "4"
        explanation: "All 4 pods would be 100 percent."
    correct_option: b
    explanation: "Correct. The weight is a ratio of the replicas, rounded up, so 25 percent of 4 is 1."

  - id: ats062-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the defaults of maxSurge and maxUnavailable"
    source_readings:
      - sections/section-020/module-02/course-01-steps-weights-and-replica-counts.md
    prompt: "What are the defaults of `maxSurge` and `maxUnavailable` for a canary `Rollout`?"
    options:
      - id: a
        text: "0 and 0"
        explanation: "Both cannot be 0, because no pod could start or stop."
      - id: b
        text: "25 percent and 25 percent"
        explanation: "These are the Deployment defaults."
      - id: c
        text: "1 and 1"
        explanation: "Correct. Both default to 1."
      - id: d
        text: "100 percent and 0"
        explanation: "These are not the defaults."
    correct_option: c
    explanation: "Correct. Both default to 1."

  - id: ats062-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain trafficRouting"
    source_readings:
      - sections/section-020/module-02/course-02-traffic-routing-and-choosing-a-strategy.md
    prompt: "What does `trafficRouting` add to a canary `Rollout`?"
    options:
      - id: a
        text: "Exact request weights set in a router, with `stableService` and `canaryService`."
        explanation: "Correct. The weight no longer depends on pod counts."
      - id: b
        text: "A load balancer that the controller installs."
        explanation: "The router must already exist. The controller does not install it."
      - id: c
        text: "Automatic analysis of the traffic."
        explanation: "Analysis is configured separately."
      - id: d
        text: "A second cluster for the canary."
        explanation: "The canary runs in the same cluster."
    correct_option: a
    explanation: "Correct. The weight no longer depends on pod counts."

  - id: ats062-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply failureLimit"
    source_readings:
      - sections/section-030/module-01/course-01-the-template-its-arguments-and-its-metrics.md
    prompt: "A metric has `count: 5` and `failureLimit: 1`. When does the metric fail?"
    options:
      - id: a
        text: "At the first failed measurement."
        explanation: "This is the case only for `failureLimit: 0`."
      - id: b
        text: "When 2 measurements have failed."
        explanation: "Correct. The metric fails when the failures exceed the limit."
      - id: c
        text: "Only when all 5 measurements fail."
        explanation: "The limit is lower than that."
      - id: d
        text: "Never, because `count` ends the metric."
        explanation: "The limit still applies during the count."
    correct_option: b
    explanation: "Correct. The metric fails when the failures exceed the limit."

  - id: ats062-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an inconclusive measurement"
    source_readings:
      - sections/section-030/module-01/course-01-the-template-its-arguments-and-its-metrics.md
    prompt: "A metric has both `successCondition: result[0] >= 0.95` and `failureCondition: result[0] < 0.80`. The value is 0.90. What is the measurement?"
    options:
      - id: a
        text: "`Successful`"
        explanation: "The success condition is false."
      - id: b
        text: "`Failed`"
        explanation: "The failure condition is false."
      - id: c
        text: "`Inconclusive`"
        explanation: "Correct. Neither condition is true."
      - id: d
        text: "`Error`"
        explanation: "No error occurred. The value was read."
    correct_option: c
    explanation: "Correct. Neither condition is true."

  - id: ats062-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a provider"
    source_readings:
      - sections/section-030/module-01/course-02-providers-and-measurement-results.md
    prompt: "You need a check that runs a script inside the cluster and uses the exit code. Which provider fits?"
    options:
      - id: a
        text: "`web`"
        explanation: "This sends a single HTTP request from the controller."
      - id: b
        text: "`prometheus`"
        explanation: "This runs a query."
      - id: c
        text: "`job`"
        explanation: "Correct. The measurement is `Successful` when the Job completes."
      - id: d
        text: "`kayenta`"
        explanation: "This is a statistical comparison service."
    correct_option: c
    explanation: "Correct. The measurement is `Successful` when the Job completes."

  - id: ats062-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know where the web provider runs"
    source_readings:
      - sections/section-030/module-01/course-02-providers-and-measurement-results.md
    prompt: "From where does the `web` provider send its request?"
    options:
      - id: a
        text: "From a pod created in the namespace of the run."
        explanation: "This is the `job` provider."
      - id: b
        text: "From the Rollouts controller."
        explanation: "Correct. The URL must be reachable from the controller."
      - id: c
        text: "From the kubelet of the canary node."
        explanation: "The kubelet takes no part."
      - id: d
        text: "From the browser of the user."
        explanation: "No user browser is involved."
    correct_option: b
    explanation: "Correct. The URL must be reachable from the controller."

