  source_readings:
  - sections/section-010/module-01/course-04-template-changes-metadata-and-placement.md
  prompt: What does a hard `requiredDuringSchedulingIgnoredDuringExecution` anti-affinity
    rule risk on a small cluster?
  options:
  - id: a
    text: The pod template hash changes.
    explanation: Not correct. A hard rule leaves the pod unscheduled instead of placing
      it on a shared node.
  - id: b
    text: The old pods are deleted.
    explanation: Not correct. A hard rule leaves the pod unscheduled instead of placing
      it on a shared node.
  - id: c
    text: The Rollout is deleted.
    explanation: Not correct. A hard rule leaves the pod unscheduled instead of placing
      it on a shared node.
  - id: d
    text: New pods stay `Pending` when no free node exists.
    explanation: Correct. A hard rule leaves the pod unscheduled instead of placing
      it on a shared node.
  correct_option: d
  explanation: Correct. A hard rule leaves the pod unscheduled instead of placing
    it on a shared node.
