- id: ats062-final-q14
  type: single_choice
  difficulty: intermediate
  learning_objective: Without it, the controller only reports `ProgressDeadlineExceeded`
  source_readings:
  - sections/section-010/module-01/course-03-timing-capacity-and-history-fields.md
  prompt: 'What does `progressDeadlineAbort: true` add?'
