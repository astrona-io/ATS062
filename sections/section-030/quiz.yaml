# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats062-030
course_id: ATS062
exam_code: CAPA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Describe Analysis Template and AnalysisRun"
questions:
  - id: ats062-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Distinguish template and run"
    source_readings:
      - sections/section-030/module-01/course-01-the-template-its-arguments-and-its-metrics.md
    prompt: "What is the difference between an `AnalysisTemplate` and an `AnalysisRun`?"
    options:
      - id: a
        text: "The template is a reusable definition. The run is one execution with measurements and a result."
        explanation: "Correct. The run copies the metrics at creation."
      - id: b
        text: "The template runs the checks. The run only stores the result."
        explanation: "The template runs nothing."
      - id: c
        text: "They are the same object in two namespaces."
        explanation: "They are different kinds."
      - id: d
        text: "The run is cluster-wide and the template is namespaced."
        explanation: "The run is namespaced too."
    correct_option: a
    explanation: "Correct. The run copies the metrics at creation."

  - id: ats062-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Use template arguments"
    source_readings:
      - sections/section-030/module-01/course-01-the-template-its-arguments-and-its-metrics.md
    prompt: "How does a metric refer to an argument named `status`?"
    options:
      - id: a
        text: "`$(status)`"
        explanation: "This is not the template syntax."
      - id: b
        text: "`{{ args.status }}`"
        explanation: "Correct."
      - id: c
        text: "`${args.status}`"
        explanation: "This is not the template syntax."
      - id: d
        text: "`<status>`"
        explanation: "This is not the template syntax."
    correct_option: b
    explanation: "Correct."

  - id: ats062-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply failureLimit"
    source_readings:
      - sections/section-030/module-01/course-01-the-template-its-arguments-and-its-metrics.md
    prompt: "A metric has `count: 5` and `failureLimit: 1`. When does the metric fail?"
    options:
      - id: a
        text: "At the first failed measurement."
        explanation: "This is the case only for `failureLimit: 0`."
      - id: b
        text: "When 2 measurements have failed."
        explanation: "Correct. The metric fails when the failures exceed the limit."
      - id: c
        text: "Only when all 5 measurements fail."
        explanation: "The limit is lower than that."
      - id: d
        text: "Never, because `count` ends the metric."
        explanation: "The limit still applies during the count."
    correct_option: b
    explanation: "Correct. The metric fails when the failures exceed the limit."

  - id: ats062-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an inconclusive measurement"
    source_readings:
      - sections/section-030/module-01/course-01-the-template-its-arguments-and-its-metrics.md
    prompt: "A metric has both `successCondition: result[0] >= 0.95` and `failureCondition: result[0] < 0.80`. The value is 0.90. What is the measurement?"
    options:
      - id: a
        text: "`Successful`"
        explanation: "The success condition is false."
      - id: b
        text: "`Failed`"
        explanation: "The failure condition is false."
      - id: c
        text: "`Inconclusive`"
        explanation: "Correct. Neither condition is true."
      - id: d
        text: "`Error`"
        explanation: "No error occurred. The value was read."
    correct_option: c
    explanation: "Correct. Neither condition is true."

  - id: ats062-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a provider"
    source_readings:
      - sections/section-030/module-01/course-02-providers-and-measurement-results.md
    prompt: "You need a check that runs a script inside the cluster and uses the exit code. Which provider fits?"
    options:
      - id: a
        text: "`web`"
        explanation: "This sends a single HTTP request from the controller."
      - id: b
        text: "`prometheus`"
        explanation: "This runs a query."
      - id: c
        text: "`job`"
        explanation: "Correct. The measurement is `Successful` when the Job completes."
      - id: d
        text: "`kayenta`"
        explanation: "This is a statistical comparison service."
    correct_option: c
    explanation: "Correct. The measurement is `Successful` when the Job completes."

  - id: ats062-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know where the web provider runs"
    source_readings:
      - sections/section-030/module-01/course-02-providers-and-measurement-results.md
    prompt: "From where does the `web` provider send its request?"
    options:
      - id: a
        text: "From a pod created in the namespace of the run."
        explanation: "This is the `job` provider."
      - id: b
        text: "From the Rollouts controller."
        explanation: "Correct. The URL must be reachable from the controller."
      - id: c
        text: "From the kubelet of the canary node."
        explanation: "The kubelet takes no part."
      - id: d
        text: "From the browser of the user."
        explanation: "No user browser is involved."
    correct_option: b
    explanation: "Correct. The URL must be reachable from the controller."

  - id: ats062-030-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Read a run phase for the Rollout"
    source_readings:
      - sections/section-030/module-02/course-02-how-a-result-changes-the-rollout-and-experiments.md
    prompt: "An `AnalysisRun` created by an inline step ends in `Inconclusive`. What does the controller do with the `Rollout`?"
    options:
      - id: a
        text: "It aborts the release."
        explanation: "This happens for `Failed` and `Error`."
      - id: b
        text: "It pauses the release and waits for a decision."
        explanation: "Correct. A person promotes or aborts."
      - id: c
        text: "It promotes the release to 100 percent."
        explanation: "This happens only for `Successful`."
      - id: d
        text: "It deletes the run and starts again."
        explanation: "The controller does not restart the run."
    correct_option: b
    explanation: "Correct. A person promotes or aborts."

  - id: ats062-030-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Place a background analysis"
    source_readings:
      - sections/section-030/module-02/course-01-the-analysisrun-lifecycle-and-where-a-rollout-runs-it.md
    prompt: "Which block runs an analysis beside the canary steps from a chosen step?"
    options:
      - id: a
        text: "`strategy.canary.analysis` with `startingStep`"
        explanation: "Correct."
      - id: b
        text: "`strategy.blueGreen.prePromotionAnalysis`"
        explanation: "This belongs to blue-green."
      - id: c
        text: "A step `analysis` with `startingStep`"
        explanation: "A step does not have this field."
      - id: d
        text: "`spec.analysis.startingStep`"
        explanation: "This block holds the history limits."
    correct_option: a
    explanation: "Correct."

  - id: ats062-030-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Describe an Experiment"
    source_readings:
      - sections/section-030/module-02/course-02-how-a-result-changes-the-rollout-and-experiments.md
    prompt: "What does an `Experiment` do?"
    options:
      - id: a
        text: "It runs temporary ReplicaSets for a set time and analyses them."
        explanation: "Correct. It can copy the stable and canary specs with `specRef`."
      - id: b
        text: "It replaces the `AnalysisRun`."
        explanation: "It uses analysis runs, so it does not replace them."
      - id: c
        text: "It changes the weight of the production traffic."
        explanation: "It does not receive production traffic."
      - id: d
        text: "It rolls back the `Rollout`."
        explanation: "It does not roll back anything."
    correct_option: a
    explanation: "Correct. It can copy the stable and canary specs with `specRef`."

  - id: ats062-030-q101
    type: single_choice
    difficulty: intermediate
    learning_objective: "Without it the controller looks for a namespaced template"
    source_readings:
      - sections/section-030/module-01/course-03-cluster-templates-and-argument-sources.md
    prompt: "What must a Rollout set to use a `ClusterAnalysisTemplate`?"
    options:
      - id: a
        text: "A namespace on the template."
        explanation: "Not correct. Without it the controller looks for a namespaced template."
      - id: b
        text: "`clusterScope: true` on the template entry."
        explanation: "Correct. Without it the controller looks for a namespaced template."
      - id: c
        text: "A `workloadRef`."
        explanation: "Not correct. Without it the controller looks for a namespaced template."
      - id: d
        text: "A `previewService`."
        explanation: "Not correct. Without it the controller looks for a namespaced template."
    correct_option: b
    explanation: "Correct. Without it the controller looks for a namespaced template."

  - id: ats062-030-q102
    type: single_choice
    difficulty: intermediate
    learning_objective: "It reads a key from a Secret in the namespace of the run"
    source_readings:
      - sections/section-030/module-01/course-03-cluster-templates-and-argument-sources.md
    prompt: "Which `valueFrom` form keeps a token out of the template?"
    options:
      - id: a
        text: "`workloadRef`"
        explanation: "Not correct. It reads a key from a Secret in the namespace of the run."
      - id: b
        text: "`podTemplateHashValue`"
        explanation: "Not correct. It reads a key from a Secret in the namespace of the run."
      - id: c
        text: "`secretKeyRef`"
        explanation: "Correct. It reads a key from a Secret in the namespace of the run."
      - id: d
        text: "`stableService`"
        explanation: "Not correct. It reads a key from a Secret in the namespace of the run."
    correct_option: c
    explanation: "Correct. It reads a key from a Secret in the namespace of the run."

  - id: ats062-030-q103
    type: single_choice
    difficulty: intermediate
    learning_objective: "Dry-run metrics cannot decide the phase of the run"
    source_readings:
      - sections/section-030/module-01/course-04-dry-run-retention-and-error-handling.md
    prompt: "What happens to a metric listed in `dryRun` when it fails?"
    options:
      - id: a
        text: "The Rollout is aborted."
        explanation: "Not correct. Dry-run metrics cannot decide the phase of the run."
      - id: b
        text: "The failure is recorded and does not fail the AnalysisRun."
        explanation: "Correct. Dry-run metrics cannot decide the phase of the run."
      - id: c
        text: "The metric is deleted."
        explanation: "Not correct. Dry-run metrics cannot decide the phase of the run."
      - id: d
        text: "The run ends in `Error`."
        explanation: "Not correct. Dry-run metrics cannot decide the phase of the run."
    correct_option: b
    explanation: "Correct. Dry-run metrics cannot decide the phase of the run."

  - id: ats062-030-q104
    type: single_choice
    difficulty: intermediate
    learning_objective: "A good measurement resets the counter"
    source_readings:
      - sections/section-030/module-01/course-04-dry-run-retention-and-error-handling.md
    prompt: "What does `consecutiveErrorLimit` count?"
    options:
      - id: a
        text: "Errors in a row, with a default of 4."
        explanation: "Correct. A good measurement resets the counter."
      - id: b
        text: "Failed measurements in total."
        explanation: "Not correct. A good measurement resets the counter."
      - id: c
        text: "Successful measurements."
        explanation: "Not correct. A good measurement resets the counter."
      - id: d
        text: "Inconclusive measurements."
        explanation: "Not correct. A good measurement resets the counter."
    correct_option: a
    explanation: "Correct. A good measurement resets the counter."

  - id: ats062-030-q105
    type: single_choice
    difficulty: intermediate
    learning_objective: "It lets a query select the canary pods"
    source_readings:
      - sections/section-030/module-02/course-03-passing-rollout-data-into-an-analysis.md
    prompt: "Which `valueFrom` form gives an analysis the hash of the newest ReplicaSet?"
    options:
      - id: a
        text: "`fieldRef` on the Service"
        explanation: "Not correct. It lets a query select the canary pods."
      - id: b
        text: "`clusterScope`"
        explanation: "Not correct. It lets a query select the canary pods."
      - id: c
        text: "`secretKeyRef`"
        explanation: "Not correct. It lets a query select the canary pods."
      - id: d
        text: "`podTemplateHashValue: Latest`"
        explanation: "Correct. It lets a query select the canary pods."
    correct_option: d
    explanation: "Correct. It lets a query select the canary pods."

  - id: ats062-030-q106
    type: single_choice
    difficulty: intermediate
    learning_objective: "The run ends with the result it has so far"
    source_readings:
      - sections/section-030/module-02/course-03-passing-rollout-data-into-an-analysis.md
    prompt: "What does `spec.terminate: true` do on an AnalysisRun?"
    options:
      - id: a
        text: "It stops the running AnalysisRun."
        explanation: "Correct. The run ends with the result it has so far."
      - id: b
        text: "It changes the template."
        explanation: "Not correct. The run ends with the result it has so far."
      - id: c
        text: "It retries the run."
        explanation: "Not correct. The run ends with the result it has so far."
      - id: d
        text: "It deletes the Rollout."
        explanation: "Not correct. The run ends with the result it has so far."
    correct_option: a
    explanation: "Correct. The run ends with the result it has so far."

  - id: ats062-030-q107
    type: single_choice
    difficulty: intermediate
    learning_objective: "Fix the query or provider before blaming the application"
    source_readings:
      - sections/section-030/module-02/course-04-reading-and-debugging-an-analysisrun.md
    prompt: "What does an `Error` measurement mean?"
    options:
      - id: a
        text: "The run was terminated."
        explanation: "Not correct. Fix the query or provider before blaming the application."
      - id: b
        text: "The measurement itself broke, for example a query timeout."
        explanation: "Correct. Fix the query or provider before blaming the application."
      - id: c
        text: "The application failed its condition."
        explanation: "Not correct. Fix the query or provider before blaming the application."
      - id: d
        text: "The data was undecided."
        explanation: "Not correct. Fix the query or provider before blaming the application."
    correct_option: b
    explanation: "Correct. Fix the query or provider before blaming the application."

  - id: ats062-030-q108
    type: single_choice
    difficulty: intermediate
    learning_objective: "From the run you go to the metric result and then the measurement"
    source_readings:
      - sections/section-030/module-02/course-04-reading-and-debugging-an-analysisrun.md
    prompt: "Where do you look first after a Rollout aborts because of analysis?"
    options:
      - id: a
        text: "The ReplicaSet labels."
        explanation: "Not correct. From the run you go to the metric result and then the measurement."
      - id: b
        text: "The Service selector."
        explanation: "Not correct. From the run you go to the metric result and then the measurement."
      - id: c
        text: "The message in the Rollout status, which names the run."
        explanation: "Correct. From the run you go to the metric result and then the measurement."
      - id: d
        text: "The Ingress."
        explanation: "Not correct. From the run you go to the metric result and then the measurement."
    correct_option: c
    explanation: "Correct. From the run you go to the metric result and then the measurement."
