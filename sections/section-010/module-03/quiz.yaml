scope:
  type: module
  id: module-03
  title: Installing Argo Rollouts
questions:
- id: ats062-010-m03-q01
  type: single_choice
  difficulty: beginner
  learning_objective: The CRDs register the kinds, and the controller does the work
  source_readings:
  - sections/section-010/module-03/course-01-installing-the-controller-and-the-custom-resources.md
  prompt: Which component creates the ReplicaSets for a `Rollout`?
  options:
  - id: a
    text: The Argo Rollouts controller
    explanation: Correct. The CRDs register the kinds, and the controller does the
      work.
  - id: b
    text: The custom resource definition
    explanation: Not correct. The CRDs register the kinds, and the controller does
      the work.
  - id: c
    text: The `kubectl argo rollouts` plugin
    explanation: Not correct. The CRDs register the kinds, and the controller does
      the work.
  - id: d
    text: The Kubernetes scheduler
    explanation: Not correct. The CRDs register the kinds, and the controller does
      the work.
  correct_option: a
  explanation: Correct. The CRDs register the kinds, and the controller does the work.
- id: ats062-010-m03-q02
  type: single_choice
  difficulty: beginner
  learning_objective: The installation registers five kinds
  source_readings:
  - sections/section-010/module-03/course-01-installing-the-controller-and-the-custom-resources.md
  prompt: Which list names the five custom resource kinds that Argo Rollouts installs?
  options:
  - id: a
    text: Rollout, Deployment, AnalysisTemplate, Gateway, Experiment
    explanation: Not correct. The installation registers five kinds.
  - id: b
    text: Rollout, Service, Ingress, AnalysisRun, Experiment
    explanation: Not correct. The installation registers five kinds.
  - id: c
    text: Rollout, Canary, BlueGreen, AnalysisRun, Experiment
    explanation: Not correct. The installation registers five kinds.
  - id: d
    text: Rollout, AnalysisTemplate, ClusterAnalysisTemplate, AnalysisRun, Experiment
    explanation: Correct. The installation registers five kinds.
  correct_option: d
  explanation: Correct. The installation registers five kinds.
- id: ats062-010-m03-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Without the controller nothing acts on a Rollout
  source_readings:
  - sections/section-010/module-03/course-01-installing-the-controller-and-the-custom-resources.md
  prompt: What happens to a `Rollout` object when the CRDs exist but the controller
    is not running?
  options:
  - id: a
    text: The API rejects it
    explanation: Not correct. Without the controller nothing acts on a Rollout.
  - id: b
    text: Kubernetes turns it into a Deployment
    explanation: Not correct. Without the controller nothing acts on a Rollout.
  - id: c
    text: The scheduler creates the pods
    explanation: Not correct. Without the controller nothing acts on a Rollout.
  - id: d
    text: The API stores it, but it gets no ReplicaSet and no status
    explanation: Correct. Without the controller nothing acts on a Rollout.
  correct_option: d
  explanation: Correct. Without the controller nothing acts on a Rollout.
- id: ats062-010-m03-q04
  type: single_choice
  difficulty: beginner
  learning_objective: The log level option sets how much the controller logs
  source_readings:
  - sections/section-010/module-03/course-02-controller-options-and-installation-scope.md
  prompt: Which controller option sets the log level?
  options:
  - id: a
    text: "`--loglevel`"
    explanation: Correct. The log level option sets how much the controller logs.
  - id: b
    text: "`--logmode`"
    explanation: Not correct. The log level option sets how much the controller logs.
  - id: c
    text: "`--verbose-level`"
    explanation: Not correct. The log level option sets how much the controller logs.
  - id: d
    text: "`--debug-only`"
    explanation: Not correct. The log level option sets how much the controller logs.
  correct_option: a
  explanation: Correct. The log level option sets how much the controller logs.
- id: ats062-010-m03-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: The instance identifier limits which Rollouts a controller manages
  source_readings:
  - sections/section-010/module-03/course-02-controller-options-and-installation-scope.md
  prompt: What does `--instance-id=team-a` do?
  options:
  - id: a
    text: The controller manages only Rollouts with the matching instance label
    explanation: Correct. The instance identifier limits which Rollouts a controller
      manages.
  - id: b
    text: The controller refuses all Rollouts in the namespace team-a
    explanation: Not correct. The instance identifier limits which Rollouts a controller
      manages.
  - id: c
    text: The controller runs only on the node team-a
    explanation: Not correct. The instance identifier limits which Rollouts a controller
      manages.
  - id: d
    text: The controller reads only the ConfigMap team-a
    explanation: Not correct. The instance identifier limits which Rollouts a controller
      manages.
  correct_option: a
  explanation: Correct. The instance identifier limits which Rollouts a controller
    manages.
- id: ats062-010-m03-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: The namespaced option limits the watch scope
  source_readings:
  - sections/section-010/module-03/course-02-controller-options-and-installation-scope.md
  prompt: What does the `--namespaced` option do?
  options:
  - id: a
    text: The controller creates one namespace for each Rollout
    explanation: Not correct. The namespaced option limits the watch scope.
  - id: b
    text: The controller ignores namespaces
    explanation: Not correct. The namespaced option limits the watch scope.
  - id: c
    text: The controller watches only its own namespace
    explanation: Correct. The namespaced option limits the watch scope.
  - id: d
    text: The controller installs the CRDs in each namespace
    explanation: Not correct. The namespaced option limits the watch scope.
  correct_option: c
  explanation: Correct. The namespaced option limits the watch scope.
- id: ats062-010-m03-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: A strategic merge patch matches containers by name
  source_readings:
  - sections/section-010/module-03/course-02-controller-options-and-installation-scope.md
  prompt: Which command adds an argument to the controller container from a patch
    file?
  options:
  - id: a
    text: "`kubectl -n argo-rollouts scale deployment argo-rollouts --args`"
    explanation: Not correct. A strategic merge patch matches containers by name.
  - id: b
    text: "`kubectl -n argo-rollouts annotate deployment argo-rollouts --args`"
    explanation: Not correct. A strategic merge patch matches containers by name.
  - id: c
    text: "`kubectl -n argo-rollouts expose deployment argo-rollouts`"
    explanation: Not correct. A strategic merge patch matches containers by name.
  - id: d
    text: "`kubectl -n argo-rollouts patch deployment argo-rollouts --patch-file controller-args.yaml`"
    explanation: Correct. A strategic merge patch matches containers by name.
  correct_option: d
  explanation: Correct. A strategic merge patch matches containers by name.
- id: ats062-010-m03-q08
  type: single_choice
  difficulty: beginner
  learning_objective: The plugin edits fields of the Rollout
  source_readings:
  - sections/section-010/module-03/course-03-the-kubectl-plugin.md
  prompt: What does `kubectl argo rollouts abort mission` change?
  options:
  - id: a
    text: It sets the abort flag in the status, and the controller returns traffic
      to the stable ReplicaSet
    explanation: Correct. The plugin edits fields of the Rollout.
  - id: b
    text: It deletes the Rollout
    explanation: Not correct. The plugin edits fields of the Rollout.
  - id: c
    text: It deletes the canary ReplicaSet and the stable ReplicaSet
    explanation: Not correct. The plugin edits fields of the Rollout.
  - id: d
    text: It removes the CRDs
    explanation: Not correct. The plugin edits fields of the Rollout.
  correct_option: a
  explanation: Correct. The plugin edits fields of the Rollout.
- id: ats062-010-m03-q09
  type: single_choice
  difficulty: beginner
  learning_objective: The dashboard is a local web server
  source_readings:
  - sections/section-010/module-03/course-04-the-dashboard-upgrades-and-removal.md
  prompt: On which port does the dashboard listen by default?
  options:
  - id: a
    text: '8090'
    explanation: Not correct. The dashboard is a local web server.
  - id: b
    text: '8080'
    explanation: Not correct. The dashboard is a local web server.
  - id: c
    text: '443'
    explanation: Not correct. The dashboard is a local web server.
  - id: d
    text: '3100'
    explanation: Correct. The dashboard is a local web server.
  correct_option: d
  explanation: Correct. The dashboard is a local web server.
- id: ats062-010-m03-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Deleting a CRD deletes all objects of its kind
  source_readings:
  - sections/section-010/module-03/course-04-the-dashboard-upgrades-and-removal.md
  prompt: Which step comes last when Argo Rollouts is removed?
  options:
  - id: a
    text: Deleting the Rollouts
    explanation: Not correct. Deleting a CRD deletes all objects of its kind.
  - id: b
    text: Deleting the controller Deployment
    explanation: Not correct. Deleting a CRD deletes all objects of its kind.
  - id: c
    text: Deleting the ClusterRole
    explanation: Not correct. Deleting a CRD deletes all objects of its kind.
  - id: d
    text: Deleting the CRDs
    explanation: Correct. Deleting a CRD deletes all objects of its kind.
  correct_option: d
  explanation: Correct. Deleting a CRD deletes all objects of its kind.
