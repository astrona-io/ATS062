# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats062-010
course_id: ATS062
exam_code: CAPA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Understand Argo Rollouts Fundamentals"
questions:
  - id: ats062-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what the Rollout controller replaces and keeps compared with a Deployment"
    source_readings:
      - sections/section-010/module-01/course-01-the-rollout-resource-and-its-controller.md
    prompt: "What does the Argo Rollouts controller do with a `Rollout` object?"
    options:
      - id: a
        text: "It converts the `Rollout` into a `Deployment` and lets the Deployment controller run it."
        explanation: "The controller does not create a Deployment. It manages ReplicaSets itself."
      - id: b
        text: "It creates and scales ReplicaSets for the `Rollout` and decides which one is stable."
        explanation: "Correct. The `Rollout` has a pod template like a Deployment, and the controller owns the ReplicaSets and applies the strategy."
      - id: c
        text: "It only watches the `Rollout` and leaves ReplicaSet creation to the kube-controller-manager."
        explanation: "The kube-controller-manager does not know the `Rollout` kind."
      - id: d
        text: "It creates one pod per replica directly, without ReplicaSets."
        explanation: "The controller uses ReplicaSets, labelled with the pod template hash."
    correct_option: b
    explanation: "Correct. The `Rollout` has a pod template like a Deployment, and the controller owns the ReplicaSets and applies the strategy."

  - id: ats062-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Identify the label that links a ReplicaSet to a pod template revision"
    source_readings:
      - sections/section-010/module-01/course-02-replicasets-hashes-and-revisions.md
    prompt: "Which label does Argo Rollouts add to pods and ReplicaSets to tell revisions apart?"
    options:
      - id: a
        text: "`app.kubernetes.io/version`"
        explanation: "This label is set by users, not by the controller."
      - id: b
        text: "`pod-template-hash`"
        explanation: "This is the label of the Deployment controller. Rollouts uses a different one."
      - id: c
        text: "`rollout.argoproj.io/revision`"
        explanation: "This is an annotation, not the selector label."
      - id: d
        text: "`rollouts-pod-template-hash`"
        explanation: "Correct. The controller adds it to every pod and ReplicaSet, and the Service selectors use it."
    correct_option: d
    explanation: "Correct. The controller adds it to every pod and ReplicaSet, and the Service selectors use it."

  - id: ats062-010-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read stableRS and currentPodHash to know the state of a release"
    source_readings:
      - sections/section-010/module-01/course-02-replicasets-hashes-and-revisions.md
    prompt: "A `Rollout` shows `status.currentPodHash` different from `status.stableRS`. What does this mean?"
    options:
      - id: a
        text: "A new revision exists and has not yet been promoted to stable."
        explanation: "Correct. `currentPodHash` is the newest template, `stableRS` is the last fully promoted one."
      - id: b
        text: "The `Rollout` is broken and must be deleted."
        explanation: "The two values differ during every normal release."
      - id: c
        text: "The `Rollout` has no ReplicaSet for the stable revision."
        explanation: "The stable ReplicaSet exists. The hashes are for two different ReplicaSets."
      - id: d
        text: "The Service selector is wrong."
        explanation: "The Service selector is not part of these two status fields."
    correct_option: a
    explanation: "Correct. `currentPodHash` is the newest template, `stableRS` is the last fully promoted one."

  - id: ats062-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe revisionHistoryLimit"
    source_readings:
      - sections/section-010/module-01/course-02-replicasets-hashes-and-revisions.md
    prompt: "A `Rollout` has `revisionHistoryLimit: 3`. What does the controller do with old ReplicaSets?"
    options:
      - id: a
        text: "It deletes all old ReplicaSets after each release."
        explanation: "The old ReplicaSets are kept, up to the limit."
      - id: b
        text: "It keeps up to 3 old scaled-down ReplicaSets and deletes the oldest beyond that."
        explanation: "Correct. They stay at 0 replicas so that an undo is possible, and the oldest are removed beyond the limit."
      - id: c
        text: "It keeps 3 pods of the old revision running."
        explanation: "Old ReplicaSets are scaled to 0 and run no pods."
      - id: d
        text: "It limits the number of canary steps to 3."
        explanation: "The steps are set in the strategy, not by this field."
    correct_option: b
    explanation: "Correct. They stay at 0 replicas so that an undo is possible, and the oldest are removed beyond the limit."

  - id: ats062-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the phase of a Rollout"
    source_readings:
      - sections/section-010/module-02/course-01-reading-status-and-controlling-a-release.md
    prompt: "A `Rollout` stopped at a `pause: {}` step. Which phase does `status.phase` show?"
    options:
      - id: a
        text: "`Healthy`"
        explanation: "The release is not complete, so the phase is not `Healthy`."
      - id: b
        text: "`Degraded`"
        explanation: "`Degraded` means the release failed or timed out."
      - id: c
        text: "`Paused`"
        explanation: "Correct. The controller reports `Paused` while a pause condition exists."
      - id: d
        text: "`Pending`"
        explanation: "`Pending` is not a Rollout phase."
    correct_option: c
    explanation: "Correct. The controller reports `Paused` while a pause condition exists."

  - id: ats062-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use workloadRef to migrate a Deployment"
    source_readings:
      - sections/section-010/module-02/course-02-migrating-a-deployment-and-routing-traffic.md
    prompt: "You want to adopt a running Deployment into Argo Rollouts without copying its pod template into a new object. Which field do you use?"
    options:
      - id: a
        text: "`spec.workloadRef` in the `Rollout`, with `scaleDown` set to say what happens to the Deployment."
        explanation: "Correct. The `Rollout` reads the pod template from the referenced Deployment, and `scaleDown` controls the Deployment replicas."
      - id: b
        text: "`spec.template.spec.deploymentName`"
        explanation: "This field does not exist."
      - id: c
        text: "`metadata.ownerReferences` pointing at the Deployment, set by hand."
        explanation: "Owner references do not make the controller read the template."
      - id: d
        text: "`strategy.canary.baseDeployment`"
        explanation: "This field does not exist."
    correct_option: a
    explanation: "Correct. The `Rollout` reads the pod template from the referenced Deployment, and `scaleDown` controls the Deployment replicas."

  - id: ats062-010-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose scaleDown for a safe migration"
    source_readings:
      - sections/section-010/module-02/course-02-migrating-a-deployment-and-routing-traffic.md
    prompt: "During a migration with `workloadRef`, the Deployment must keep serving until the `Rollout` is healthy, and then stop. Which `scaleDown` value fits?"
    options:
      - id: a
        text: "`never`"
        explanation: "The Deployment would never scale down, so both would keep running."
      - id: b
        text: "`onsuccess`"
        explanation: "Correct. The Deployment scales down only after the `Rollout` is fully available."
      - id: c
        text: "`progressively`"
        explanation: "This scales the Deployment down gradually as the `Rollout` scales up, so it does not keep the full set until success."
      - id: d
        text: "`immediately`"
        explanation: "This value does not exist."
    correct_option: b
    explanation: "Correct. The Deployment scales down only after the `Rollout` is fully available."

  - id: ats062-010-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Pause and resume a Rollout by hand"
    source_readings:
      - sections/section-010/module-02/course-01-reading-status-and-controlling-a-release.md
    prompt: "You set `spec.paused: true` on a `Rollout` in the middle of a canary. What happens?"
    options:
      - id: a
        text: "The controller deletes the canary ReplicaSet."
        explanation: "Nothing is deleted. The controller stops progressing."
      - id: b
        text: "The controller stops moving to new steps until the field is cleared."
        explanation: "Correct. The release stays where it is and resumes when `spec.paused` is false."
      - id: c
        text: "The Rollout is aborted and rolled back to the stable version."
        explanation: "A pause is not an abort."
      - id: d
        text: "The phase changes to `Degraded` after `progressDeadlineSeconds`."
        explanation: "A manual pause is not counted as a deadline failure."
    correct_option: b
    explanation: "Correct. The release stays where it is and resumes when `spec.paused` is false."

  - id: ats062-010-q101
    type: single_choice
    difficulty: intermediate
    learning_objective: "The default deadline is 600 seconds"
    source_readings:
      - sections/section-010/module-01/course-03-timing-capacity-and-history-fields.md
    prompt: "What is the default of `progressDeadlineSeconds`?"
    options:
      - id: a
        text: "3600 seconds"
        explanation: "Not correct. The default deadline is 600 seconds."
      - id: b
        text: "600 seconds"
        explanation: "Correct. The default deadline is 600 seconds."
      - id: c
        text: "60 seconds"
        explanation: "Not correct. The default deadline is 600 seconds."
      - id: d
        text: "10 seconds"
        explanation: "Not correct. The default deadline is 600 seconds."
    correct_option: b
    explanation: "Correct. The default deadline is 600 seconds."

  - id: ats062-010-q102
    type: single_choice
    difficulty: intermediate
    learning_objective: "Without it, the controller only reports `ProgressDeadlineExceeded`"
    source_readings:
      - sections/section-010/module-01/course-03-timing-capacity-and-history-fields.md
    prompt: "What does `progressDeadlineAbort: true` add?"
    options:
      - id: a
        text: "The controller promotes the release when the deadline passes."
        explanation: "Not correct. Without it, the controller only reports `ProgressDeadlineExceeded`."
      - id: b
        text: "The controller deletes the Rollout when the deadline passes."
        explanation: "Not correct. Without it, the controller only reports `ProgressDeadlineExceeded`."
      - id: c
        text: "The controller aborts the release when the progress deadline passes."
        explanation: "Correct. Without it, the controller only reports `ProgressDeadlineExceeded`."
      - id: d
        text: "The controller doubles the deadline each time."
        explanation: "Not correct. Without it, the controller only reports `ProgressDeadlineExceeded`."
    correct_option: c
    explanation: "Correct. Without it, the controller only reports `ProgressDeadlineExceeded`."

  - id: ats062-010-q103
    type: single_choice
    difficulty: intermediate
    learning_objective: "A pod is available after it has been ready for `minReadySeconds`"
    source_readings:
      - sections/section-010/module-01/course-03-timing-capacity-and-history-fields.md
    prompt: "Which field makes a ready pod count as available only after a wait?"
    options:
      - id: a
        text: "`minReadySeconds`"
        explanation: "Correct. A pod is available after it has been ready for `minReadySeconds`."
      - id: b
        text: "`revisionHistoryLimit`"
        explanation: "Not correct. A pod is available after it has been ready for `minReadySeconds`."
      - id: c
        text: "`progressDeadlineSeconds`"
        explanation: "Not correct. A pod is available after it has been ready for `minReadySeconds`."
      - id: d
        text: "`restartAt`"
        explanation: "Not correct. A pod is available after it has been ready for `minReadySeconds`."
    correct_option: a
    explanation: "Correct. A pod is available after it has been ready for `minReadySeconds`."

  - id: ats062-010-q104
    type: single_choice
    difficulty: intermediate
    learning_objective: "Only a change to the pod template changes the hash"
    source_readings:
      - sections/section-010/module-01/course-04-template-changes-metadata-and-placement.md
    prompt: "Which change to a `Rollout` creates a new revision?"
    options:
      - id: a
        text: "A change to `spec.minReadySeconds`."
        explanation: "Not correct. Only a change to the pod template changes the hash."
      - id: b
        text: "A change to `spec.revisionHistoryLimit`."
        explanation: "Not correct. Only a change to the pod template changes the hash."
      - id: c
        text: "A change to the container image in `spec.template`."
        explanation: "Correct. Only a change to the pod template changes the hash."
      - id: d
        text: "A change to `spec.replicas`."
        explanation: "Not correct. Only a change to the pod template changes the hash."
    correct_option: c
    explanation: "Correct. Only a change to the pod template changes the hash."

  - id: ats062-010-q105
    type: single_choice
    difficulty: intermediate
    learning_objective: "The metadata fields of the strategy add labels to pods after the ReplicaSet creates them"
    source_readings:
      - sections/section-010/module-01/course-04-template-changes-metadata-and-placement.md
    prompt: "How can the controller label canary pods without a new revision?"
    options:
      - id: a
        text: "With `spec.restartAt`."
        explanation: "Not correct. The metadata fields of the strategy add labels to pods after the ReplicaSet creates them."
      - id: b
        text: "With a label on the Rollout metadata."
        explanation: "Not correct. The metadata fields of the strategy add labels to pods after the ReplicaSet creates them."
      - id: c
        text: "With a label in `spec.template.metadata`."
        explanation: "Not correct. The metadata fields of the strategy add labels to pods after the ReplicaSet creates them."
      - id: d
        text: "With `canaryMetadata` in the canary strategy."
        explanation: "Correct. The metadata fields of the strategy add labels to pods after the ReplicaSet creates them."
    correct_option: d
    explanation: "Correct. The metadata fields of the strategy add labels to pods after the ReplicaSet creates them."

  - id: ats062-010-q106
    type: single_choice
    difficulty: intermediate
    learning_objective: "A hard rule leaves the pod unscheduled instead of placing it on a shared node"
    source_readings:
      - sections/section-010/module-01/course-04-template-changes-metadata-and-placement.md
    prompt: "What does a hard `requiredDuringSchedulingIgnoredDuringExecution` anti-affinity rule risk on a small cluster?"
    options:
      - id: a
        text: "The pod template hash changes."
        explanation: "Not correct. A hard rule leaves the pod unscheduled instead of placing it on a shared node."
      - id: b
        text: "The old pods are deleted."
        explanation: "Not correct. A hard rule leaves the pod unscheduled instead of placing it on a shared node."
      - id: c
        text: "The Rollout is deleted."
        explanation: "Not correct. A hard rule leaves the pod unscheduled instead of placing it on a shared node."
      - id: d
        text: "New pods stay `Pending` when no free node exists."
        explanation: "Correct. A hard rule leaves the pod unscheduled instead of placing it on a shared node."
    correct_option: d
    explanation: "Correct. A hard rule leaves the pod unscheduled instead of placing it on a shared node."

  - id: ats062-010-q107
    type: single_choice
    difficulty: intermediate
    learning_objective: "The controller metrics port is 8090"
    source_readings:
      - sections/section-010/module-02/course-03-observing-a-release-events-logs-and-metrics.md
    prompt: "On which port does the Argo Rollouts controller serve Prometheus metrics?"
    options:
      - id: a
        text: "80"
        explanation: "Not correct. The controller metrics port is 8090."
      - id: b
        text: "8090"
        explanation: "Correct. The controller metrics port is 8090."
      - id: c
        text: "9090"
        explanation: "Not correct. The controller metrics port is 8090."
      - id: d
        text: "443"
        explanation: "Not correct. The controller metrics port is 8090."
    correct_option: b
    explanation: "Correct. The controller metrics port is 8090."

  - id: ats062-010-q108
    type: single_choice
    difficulty: intermediate
    learning_objective: "The controller writes one structured log line for each action"
    source_readings:
      - sections/section-010/module-02/course-03-observing-a-release-events-logs-and-metrics.md
    prompt: "Where do you find why the controller chose an action when the status has no useful message?"
    options:
      - id: a
        text: "In the Service selector."
        explanation: "Not correct. The controller writes one structured log line for each action."
      - id: b
        text: "In the ReplicaSet name."
        explanation: "Not correct. The controller writes one structured log line for each action."
      - id: c
        text: "In the pod template."
        explanation: "Not correct. The controller writes one structured log line for each action."
      - id: d
        text: "In the controller log in the `argo-rollouts` namespace."
        explanation: "Correct. The controller writes one structured log line for each action."
    correct_option: d
    explanation: "Correct. The controller writes one structured log line for each action."

  - id: ats062-010-q109
    type: single_choice
    difficulty: intermediate
    learning_objective: "The controller sets `InvalidSpec` with the reason in the message"
    source_readings:
      - sections/section-010/module-02/course-04-failed-releases-and-recovery.md
    prompt: "Which condition shows that the controller rejected a Rollout spec as invalid?"
    options:
      - id: a
        text: "`Paused`"
        explanation: "Not correct. The controller sets `InvalidSpec` with the reason in the message."
      - id: b
        text: "`Available`"
        explanation: "Not correct. The controller sets `InvalidSpec` with the reason in the message."
      - id: c
        text: "`Healthy`"
        explanation: "Not correct. The controller sets `InvalidSpec` with the reason in the message."
      - id: d
        text: "`InvalidSpec`"
        explanation: "Correct. The controller sets `InvalidSpec` with the reason in the message."
    correct_option: d
    explanation: "Correct. The controller sets `InvalidSpec` with the reason in the message."

  - id: ats062-010-q110
    type: single_choice
    difficulty: intermediate
    learning_objective: "The strategy never removed the stable ReplicaSet"
    source_readings:
      - sections/section-010/module-02/course-04-failed-releases-and-recovery.md
    prompt: "Which ReplicaSet keeps serving while a release is `Degraded` because new pods never become ready?"
    options:
      - id: a
        text: "The new ReplicaSet."
        explanation: "Not correct. The strategy never removed the stable ReplicaSet."
      - id: b
        text: "The stable ReplicaSet."
        explanation: "Correct. The strategy never removed the stable ReplicaSet."
      - id: c
        text: "No ReplicaSet."
        explanation: "Not correct. The strategy never removed the stable ReplicaSet."
      - id: d
        text: "A ReplicaSet created by the Deployment controller."
        explanation: "Not correct. The strategy never removed the stable ReplicaSet."
    correct_option: b
    explanation: "Correct. The strategy never removed the stable ReplicaSet."
