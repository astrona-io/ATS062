apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: beacon
  namespace: starfleet
spec:
  replicas: 2
  progressDeadlineSeconds: 90
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      containers:
      - name: beacon
        image: docker.io/library/python:3.13-alpine
        ports:
        - containerPort: 8080
        command:
        - python
        - -m
        - http.server
        - '8080'
  strategy:
    canary:
      steps:
      - setWeight: 50
      - pause: {duration: 5s}
