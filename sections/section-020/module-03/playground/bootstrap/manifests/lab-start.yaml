apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mission
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mission
  template:
    metadata:
      labels:
        app: mission
    spec:
      containers:
      - name: mission
        image: docker.io/library/python:3.13-alpine
        env:
        - name: REVISION
          value: one
        ports:
        - containerPort: 8080
        command:
        - python
        - -m
        - http.server
        - '8080'
  strategy:
    canary: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mission-stable
  namespace: starfleet
spec:
  selector:
    app: mission
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mission-canary
  namespace: starfleet
spec:
  selector:
    app: mission
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mission-ingress
  namespace: starfleet
spec:
  rules:
  - host: mission.example.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mission-stable
            port:
              number: 80
