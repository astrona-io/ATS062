  - id: b
    text: The Gateway
    explanation: Not correct. Istio splits by routes in a VirtualService.
  - id: c
    text: The PeerAuthentication
    explanation: Not correct. Istio splits by routes in a VirtualService.
  - id: d
    text: The Sidecar
    explanation: Not correct. Istio splits by routes in a VirtualService.
  correct_option: a
  explanation: Correct. Istio splits by routes in a VirtualService.
- id: ats062-020-m03-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Subsets use a DestinationRule
  source_readings:
  - sections/section-020/module-03/course-03-the-istio-provider.md
  prompt: When one Service is used with subsets, which object defines the subsets?
  options:
  - id: a
    text: An Ingress
    explanation: Not correct. Subsets use a DestinationRule.
  - id: b
    text: A DestinationRule
    explanation: Correct. Subsets use a DestinationRule.
  - id: c
    text: A ConfigMap
    explanation: Not correct. Subsets use a DestinationRule.
  - id: d
    text: A ServiceAccount
    explanation: Not correct. Subsets use a DestinationRule.
  correct_option: b
  explanation: Correct. Subsets use a DestinationRule.
