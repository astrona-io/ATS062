questions:
- id: ats062-020-m03-q01
  type: single_choice
  difficulty: beginner
  learning_objective: A provider splits traffic by exact weight
  source_readings:
  - sections/section-020/module-03/course-01-how-the-controller-drives-a-provider.md
  prompt: What does a traffic management provider add to a canary?
  options:
  - id: a
    text: Exact request weights instead of weights by pod count
    explanation: Correct. A provider splits traffic by exact weight.
  - id: b
    text: More pods in the stable ReplicaSet
    explanation: Not correct. A provider splits traffic by exact weight.
  - id: c
    text: A second controller
    explanation: Not correct. A provider splits traffic by exact weight.
  - id: d
    text: A longer pause
    explanation: Not correct. A provider splits traffic by exact weight.
  correct_option: a
  explanation: Correct. A provider splits traffic by exact weight.
- id: ats062-020-m03-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: The controller edits the provider objects
  source_readings:
  - sections/section-020/module-03/course-01-how-the-controller-drives-a-provider.md
  prompt: Which component changes the provider objects during a canary?
  options:
  - id: a
    text: The Rollouts controller
    explanation: Correct. The controller edits the provider objects.
  - id: b
    text: The kubelet
    explanation: Not correct. The controller edits the provider objects.
  - id: c
    text: The provider itself
    explanation: Not correct. The controller edits the provider objects.
  - id: d
    text: The kubectl plugin
    explanation: Not correct. The controller edits the provider objects.
  correct_option: a
  explanation: Correct. The controller edits the provider objects.
- id: ats062-020-m03-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Stable and canary Services have separate selectors
  source_readings:
  - sections/section-020/module-03/course-01-how-the-controller-drives-a-provider.md
  prompt: What do `stableService` and `canaryService` give the provider?
  options:
  - id: a
    text: Two Services whose selectors the controller points at the stable and canary
      pods
    explanation: Correct. Stable and canary Services have separate selectors.
  - id: b
    text: Two namespaces
    explanation: Not correct. Stable and canary Services have separate selectors.
  - id: c
    text: Two Ingress classes
    explanation: Not correct. Stable and canary Services have separate selectors.
  - id: d
    text: Two controllers
    explanation: Not correct. Stable and canary Services have separate selectors.
  correct_option: a
  explanation: Correct. Stable and canary Services have separate selectors.
- id: ats062-020-m03-q04
  type: single_choice
  difficulty: beginner
  learning_objective: The canary Ingress is created by the controller
  source_readings:
  - sections/section-020/module-03/course-02-the-nginx-ingress-provider.md
  prompt: Who creates the canary Ingress in the NGINX integration?
  options:
  - id: a
    text: The NGINX Ingress controller
    explanation: Not correct. The canary Ingress is created by the controller.
  - id: b
    text: The Rollouts controller
    explanation: Correct. The canary Ingress is created by the controller.
  - id: c
    text: The administrator
    explanation: Not correct. The canary Ingress is created by the controller.
  - id: d
    text: The kubelet
    explanation: Not correct. The canary Ingress is created by the controller.
  correct_option: b
  explanation: Correct. The canary Ingress is created by the controller.
- id: ats062-020-m03-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: The name follows a pattern
  source_readings:
  - sections/section-020/module-03/course-02-the-nginx-ingress-provider.md
  prompt: How is the canary Ingress named for the Rollout `mission` and the stable
    Ingress `mission-ingress`?
  options:
  - id: a
    text: "`mission-ingress-canary`"
    explanation: Not correct. The name follows a pattern.
  - id: b
    text: "`canary-mission`"
    explanation: Not correct. The name follows a pattern.
  - id: c
    text: "`mission-canary-ingress`"
    explanation: Not correct. The name follows a pattern.
  - id: d
    text: "`mission-mission-ingress-canary`"
    explanation: Correct. The name follows a pattern.
  correct_option: d
  explanation: Correct. The name follows a pattern.
- id: ats062-020-m03-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: The annotation sets the weight
  source_readings:
  - sections/section-020/module-03/course-02-the-nginx-ingress-provider.md
  prompt: Which annotation carries the weight on the canary Ingress?
  options:
  - id: a
    text: "`nginx.ingress.kubernetes.io/weight`"
    explanation: Not correct. The annotation sets the weight.
  - id: b
    text: "`nginx.ingress.kubernetes.io/canary-weight`"
    explanation: Correct. The annotation sets the weight.
  - id: c
    text: "`argoproj.io/canary-weight`"
    explanation: Not correct. The annotation sets the weight.
  - id: d
    text: "`nginx.ingress.kubernetes.io/split`"
    explanation: Not correct. The annotation sets the weight.
  correct_option: b
  explanation: Correct. The annotation sets the weight.
