- id: ats062-020-m03-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Plugins add providers
  source_readings:
  - sections/section-020/module-03/course-04-other-providers-and-the-plugin-route.md
  prompt: How does a team add a traffic router that Argo Rollouts does not include?
  options:
  - id: a
    text: With a traffic router plugin registered in the controller configuration
    explanation: Correct. Plugins add providers.
  - id: b
    text: By editing the CRD
    explanation: Not correct. Plugins add providers.
  - id: c
    text: By forking the Rollout kind
    explanation: Not correct. Plugins add providers.
  - id: d
    text: By using a Job
    explanation: Not correct. Plugins add providers.
  correct_option: a
  explanation: Correct. Plugins add providers.
