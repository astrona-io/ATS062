apiVersion: v1
kind: Service
metadata:
  name: relay-active
  namespace: starfleet
spec:
  selector:
    app: relay
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: relay-preview
  namespace: starfleet
spec:
  selector:
    app: relay
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: relay
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
      - name: relay
        image: docker.io/library/python:3.13-alpine
        ports:
        - containerPort: 8080
        command:
        - python
        - -m
        - http.server
        - '8080'
  strategy:
    blueGreen:
      activeService: relay-active
      previewService: relay-preview
      previewReplicaCount: 1
      scaleDownDelaySeconds: 45
      activeMetadata:
        labels:
          role: active
