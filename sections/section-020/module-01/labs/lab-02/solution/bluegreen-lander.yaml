apiVersion: v1
kind: Service
metadata:
  name: lander-active
  namespace: starfleet
spec:
  selector:
    app: lander
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: lander-preview
  namespace: starfleet
spec:
  selector:
    app: lander
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: lander
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lander
  template:
    metadata:
      labels:
        app: lander
    spec:
      containers:
      - name: lander
        image: docker.io/library/python:3.13-alpine
        ports:
        - containerPort: 8080
        command:
        - python
        - -m
        - http.server
        - '8080'
  strategy:
    blueGreen:
      activeService: lander-active
      previewService: lander-preview
      previewReplicaCount: 1
      scaleDownDelaySeconds: 45
      activeMetadata:
        labels:
          role: active
