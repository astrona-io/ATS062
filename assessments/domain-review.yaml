kind: question_bank
id: ats062-domain-review
course_id: ATS062
exam_code: CAPA
status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: domain
  id: domain-review
  title: Argo Rollouts
placement:
  position: after
  reading: sections/section-030/module-01/course-02-summary.md
questions:
- id: ats062-domain-review-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish a Rollout resource from a standard Deployment.
  source_readings:
  - sections/section-010/module-01/course-01-rollout-controller-replicasets-and-promotion-state.md
  prompt: What does Argo Rollouts add?
  options:
  - id: a
    text: Progressive-delivery control and supported promotion decisions.
    explanation: It extends workload replacement behavior.
  - id: b
    text: A replacement for every Kubernetes scheduler.
    explanation: Placement remains a native responsibility.
  - id: c
    text: Automatic image compilation.
    explanation: Build is separate.
  correct_option: a
  explanation: It extends workload replacement behavior.
- id: ats062-domain-review-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain controller-managed versions and strategy state.
  source_readings:
  - sections/section-010/module-01/course-01-rollout-controller-replicasets-and-promotion-state.md
  prompt: What does the Rollout controller manage under its strategy?
  options:
  - id: a
    text: Every user database row.
    explanation: Business data is outside that controller contract.
  - id: b
    text: Every Git commit in the repository.
    explanation: Source management is separate.
  - id: c
    text: Relevant ReplicaSets and progression state.
    explanation: It coordinates version transitions.
  correct_option: c
  explanation: It coordinates version transitions.
- id: ats062-domain-review-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Separate readiness, promotion and analysis evidence.
  source_readings:
  - sections/section-010/module-01/course-01-rollout-controller-replicasets-and-promotion-state.md
  prompt: Does Ready necessarily mean the new version should be promoted?
  options:
  - id: a
    text: Yes; no comparison with the stable version is ever needed.
    explanation: Progressive delivery can require wider evidence.
  - id: b
    text: No; analysis and business criteria can provide additional gates.
    explanation: Readiness establishes a bounded serving condition.
  - id: c
    text: Yes; readiness proves every regression is absent.
    explanation: Health checks have limited coverage.
  correct_option: b
  explanation: Readiness establishes a bounded serving condition.
- id: ats062-domain-review-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Compare incremental canary exposure with blue-green promotion.
  source_readings:
  - sections/section-020/module-01/course-01-canary-steps-and-blue-green-service-switching.md
  prompt: What characterizes a canary strategy?
  options:
  - id: a
    text: Incremental exposure with review or analysis between steps.
    explanation: It limits the initial affected population.
  - id: b
    text: Every version instantly receives all traffic.
    explanation: That is not staged exposure.
  - id: c
    text: A permanent ban on more than one replica.
    explanation: Replica count is a separate setting.
  correct_option: a
  explanation: It limits the initial affected population.
- id: ats062-domain-review-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain stable, canary, active and preview Service relationships.
  source_readings:
  - sections/section-020/module-01/course-01-canary-steps-and-blue-green-service-switching.md
  prompt: What is the preview Service used for in blue-green?
  options:
  - id: a
    text: Automatically restoring every database backup.
    explanation: Data recovery is separate.
  - id: b
    text: Selecting every unrelated namespace.
    explanation: The Service selects a defined backend population.
  - id: c
    text: Accessing the candidate version before active promotion.
    explanation: It separates candidate inspection from active traffic.
  correct_option: c
  explanation: It separates candidate inspection from active traffic.
- id: ats062-domain-review-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Relate pauses, weights and scale to actual request distribution.
  source_readings:
  - sections/section-020/module-01/course-01-canary-steps-and-blue-green-service-switching.md
  prompt: Does a configured 10% weight guarantee exactly 10% of business users?
  options:
  - id: a
    text: Yes; Pod count alone guarantees exact request distribution.
    explanation: Replica ratios are not exact routing weights.
  - id: b
    text: No; routing, connections and request behavior affect observations.
    explanation: The intended traffic split needs actual evidence.
  - id: c
    text: Yes; every user is permanently assigned by Kubernetes namespace.
    explanation: That is not the generic contract.
  correct_option: b
  explanation: The intended traffic split needs actual evidence.
- id: ats062-domain-review-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Distinguish reusable analysis definitions from individual executions.
  source_readings:
  - sections/section-030/module-01/course-01-analysistemplate-measurements-and-analysisrun-decisions.md
  prompt: How does AnalysisRun differ from AnalysisTemplate?
  options:
  - id: a
    text: It records an individual analysis execution.
    explanation: The template is a reusable definition.
  - id: b
    text: It is always the application image itself.
    explanation: Analysis and artifacts differ.
  - id: c
    text: It replaces the entire Kubernetes API.
    explanation: It is a custom resource execution.
  correct_option: a
  explanation: The template is a reusable definition.
- id: ats062-domain-review-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain metric providers, arguments and success or failure conditions.
  source_readings:
  - sections/section-030/module-01/course-01-analysistemplate-measurements-and-analysisrun-decisions.md
  prompt: Why supply stable and canary context as arguments?
  options:
  - id: a
    text: Arguments automatically create missing metric samples.
    explanation: They provide input rather than observations.
  - id: b
    text: Every provider ignores arguments.
    explanation: Supported templates can use them.
  - id: c
    text: Measurements must select the intended comparison populations.
    explanation: Incorrect selectors can evaluate unrelated traffic.
  correct_option: c
  explanation: Incorrect selectors can evaluate unrelated traffic.
- id: ats062-domain-review-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Interpret missing data, errors and inconclusive results.
  source_readings:
  - sections/section-030/module-01/course-01-analysistemplate-measurements-and-analysisrun-decisions.md
  prompt: Why should an empty query not be treated blindly as release success?
  options:
  - id: a
    text: All providers necessarily return identical error semantics.
    explanation: Provider behavior needs interpretation.
  - id: b
    text: It can indicate no traffic or missing observation.
    explanation: The evidence may be insufficient.
  - id: c
    text: Every empty result proves zero failures.
    explanation: Absence and zero differ.
  correct_option: b
  explanation: The evidence may be insufficient.
